[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taplab"
version = "0.1.0"
description = "TAPLab: An Open Laboratory for Reproducible Traffic Assignment Experiments"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
full = ["aequilibrae", "pyyaml", "pandas"]

[project.scripts]
taplab = "taplab.cli:main"

[tool.setuptools.packages.find]
include = ["taplab*"]
